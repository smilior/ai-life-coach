<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle (iOS style) -->
  <rect width="180" height="180" rx="36" fill="url(#bg-grad)"/>
  <!-- Soil / base arc -->
  <ellipse cx="90" cy="135" rx="36" ry="8" fill="#ffffff" opacity="0.25"/>
  <!-- Stem -->
  <path d="M90 135 C90 115 90 100 90 85" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Left leaf -->
  <path d="M90 107 C81 100 68 92 64 82 C64 82 75 86 90 100" fill="url(#leaf-grad)" opacity="0.9"/>
  <!-- Right leaf -->
  <path d="M90 93 C99 87 110 81 116 72 C116 72 106 77 90 90" fill="url(#leaf-grad)" opacity="0.9"/>
  <!-- Top sprout -->
  <path d="M90 85 C88 78 84 69 80 60 C84 63 90 71 90 71 C90 71 96 63 100 60 C96 69 92 78 90 85 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Sparkles -->
  <circle cx="110" cy="53" r="2.2" fill="#ffffff" opacity="0.7"/>
  <circle cx="117" cy="60" r="1.5" fill="#ffffff" opacity="0.5"/>
</svg>
